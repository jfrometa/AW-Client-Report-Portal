{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <nav class="flex mb-8" aria-label="Breadcrumb">
        <ol class="flex items-center space-x-2">
            <li><a href="{{ url_for('main.index') }}" class="text-gray-500 hover:text-gray-700">Dashboard</a></li>
            <li><svg class="h-5 w-5 text-gray-300" fill="currentColor" viewBox="0 0 20 20"><path d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"/></svg></li>
            <li><a href="{{ url_for('main.client_detail', client_id=client.id) }}" class="text-gray-500 hover:text-gray-700">{{ client.full_name }}</a></li>
            <li><svg class="h-5 w-5 text-gray-300" fill="currentColor" viewBox="0 0 20 20"><path d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"/></svg></li>
            <li class="text-gray-900 font-medium">Edit Client Profile</li>
        </ol>
    </nav>

    <h1 class="text-3xl font-bold text-gray-900 mb-8">Edit Client Profile</h1>

    <div class="bg-white shadow sm:rounded-lg">
        <form action="{{ url_for('main.edit_client', client_id=client.id) }}" method="POST" class="space-y-8 divide-y divide-gray-200 p-8">
            <div class="space-y-6">
                <div>
                    <h3 class="text-lg font-medium leading-6 text-gray-900">Personal Information</h3>
                </div>

                <div class="grid grid-cols-1 gap-y-6 gap-x-4 sm:grid-cols-6">
                    <div class="sm:col-span-3">
                        <label for="first_name" class="block text-sm font-medium text-gray-700">First Name</label>
                        <input type="text" name="first_name" id="first_name" value="{{ client.first_name }}" required class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-primary focus:border-primary sm:text-sm border p-2">
                    </div>

                    <div class="sm:col-span-3">
                        <label for="last_name" class="block text-sm font-medium text-gray-700">Last Name</label>
                        <input type="text" name="last_name" id="last_name" value="{{ client.last_name }}" required class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-primary focus:border-primary sm:text-sm border p-2">
                    </div>

                    <div class="sm:col-span-3">
                        <label for="dob" class="block text-sm font-medium text-gray-700">Date of Birth</label>
                        <input type="date" name="dob" id="dob" value="{{ client.dob.strftime('%Y-%m-%d') if client.dob else '' }}" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-primary focus:border-primary sm:text-sm border p-2">
                    </div>

                    <div class="sm:col-span-3">
                        <label for="ssn_last_four" class="block text-sm font-medium text-gray-700">SSN (Last 4)</label>
                        <input type="text" name="ssn_last_four" id="ssn_last_four" maxlength="4" pattern="\d{4}" value="{{ client.ssn_last_four }}" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-primary focus:border-primary sm:text-sm border p-2">
                    </div>
                </div>
            </div>

            <div class="pt-8 space-y-6">
                <div>
                    <h3 class="text-lg font-medium leading-6 text-gray-900">Financial Baseline</h3>
                </div>

                <div class="grid grid-cols-1 gap-y-6 gap-x-4 sm:grid-cols-6">
                    <div class="sm:col-span-2">
                        <label for="monthly_salary" class="block text-sm font-medium text-gray-700">Monthly Salary (Inflow)</label>
                        <div class="mt-1 relative rounded-md shadow-sm">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <span class="text-gray-500 sm:text-sm">$</span>
                            </div>
                            <input type="number" step="0.01" name="monthly_salary" id="monthly_salary" value="{{ client.monthly_salary }}" class="focus:ring-primary focus:border-primary block w-full pl-7 pr-12 sm:text-sm border-gray-300 rounded-md border p-2">
                        </div>
                    </div>

                    <div class="sm:col-span-2">
                        <label for="expense_budget" class="block text-sm font-medium text-gray-700">Monthly Expenses (Outflow)</label>
                        <div class="mt-1 relative rounded-md shadow-sm">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <span class="text-gray-500 sm:text-sm">$</span>
                            </div>
                            <input type="number" step="0.01" name="expense_budget" id="expense_budget" value="{{ client.expense_budget }}" class="focus:ring-primary focus:border-primary block w-full pl-7 pr-12 sm:text-sm border-gray-300 rounded-md border p-2">
                        </div>
                    </div>

                    <div class="sm:col-span-2">
                        <label for="deductibles_total" class="block text-sm font-medium text-gray-700">Total Monthly Deductibles/label>
                        <div class="mt-1 relative rounded-md shadow-sm">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <span class="text-gray-500 sm:text-sm">$</span>
                            </div>
                            <input type="number" step="0.01" name="deductibles_total" id="deductibles_total" value="{{ client.deductibles_total }}" class="focus:ring-primary focus:border-primary block w-full pl-7 pr-12 sm:text-sm border-gray-300 rounded-md border p-2">
                        </div>
                    </div>

                    <div class="sm:col-span-6">
                        <label for="private_reserve_target_override" class="block text-sm font-medium text-gray-700">Private Reserve Target Override (Optional)</label>
                        <p class="text-xs text-gray-500 mt-1">Default target is (6 × Monthly Expenses) + Deductibles.</p>
                        <div class="mt-2 relative rounded-md shadow-sm max-w-xs">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <span class="text-gray-500 sm:text-sm">$</span>
                            </div>
                            <input type="number" step="0.01" name="private_reserve_target_override" id="private_reserve_target_override" value="{{ client.private_reserve_target_override if client.private_reserve_target_override is not none else '' }}" class="focus:ring-primary focus:border-primary block w-full pl-7 pr-12 sm:text-sm border-gray-300 rounded-md border p-2" placeholder="Leave blank to auto-calc">
                        </div>
                    </div>
                </div>
            </div>

            <div class="pt-5">
                <div class="flex justify-end space-x-3">
                    <a href="{{ url_for('main.client_detail', client_id=client.id) }}" class="bg-white py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">Cancel</a>
                    <button type="submit" class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-primary hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">Save Changes</button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
